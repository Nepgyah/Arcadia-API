name: Pytest Actions
on:
  pull_request:
    branches:
      - main

jobs:
  Unit-Tests:
    name: Executes unit tests
    runs-on: ubuntu-latest
    env:
        DJANGO_SECRET: testkey
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: testdb
        DB_USER: postgres
        DB_PASSWORD: password
        DB_HOST: localhost
        DB_PORT: 5432

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setting up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test the Miru app
        run: pytest miru/

      - name: Test the Users app
        run: pytest users/

      - name: Test the auth app
        run: pytest authorization/